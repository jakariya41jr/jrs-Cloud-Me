<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>JRS Cloud • অ্যাডমিন প্যানেল</title>
  <meta name="description" content="JRS Cloud অ্যাডমিন প্যানেল — ইউজার ব্যবস্থাপনা, কন্টাক্ট মনিটরিং, ব্যান/আনব্যান ও ইম্পারসোনেশন।">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Hind+Siliguri:wght@400;500;600;700&display=swap');
    
    * { box-sizing: border-box; }
    
    body {
      font-family: 'Inter', 'Hind Siliguri', system-ui, sans-serif;
      background-color: #020617; /* Deep slate base */
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }

    /* Animated Background Blobs */
    .bg-shape1 { position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(79,70,229,0.15) 0%, rgba(0,0,0,0) 70%); border-radius: 50%; z-index: -1; filter: blur(60px); }
    .bg-shape2 { position: fixed; bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: radial-gradient(circle, rgba(147,51,234,0.1) 0%, rgba(0,0,0,0) 70%); border-radius: 50%; z-index: -1; filter: blur(80px); }

    /* Glassmorphism Classes */
    .glass { 
      background: rgba(30, 41, 59, 0.4); 
      backdrop-filter: blur(16px); 
      -webkit-backdrop-filter: blur(16px); 
      border: 1px solid rgba(255, 255, 255, 0.08); 
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }
    .glass-card { 
      background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%); 
      backdrop-filter: blur(10px); 
      -webkit-backdrop-filter: blur(10px); 
      border: 1px solid rgba(255, 255, 255, 0.05); 
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .glass-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      border-color: rgba(255, 255, 255, 0.1);
    }
    
    .btn-glass { 
      background: rgba(255, 255, 255, 0.05); 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      color: #f8fafc; 
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
      cursor: pointer; 
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-glass:hover { 
      background: rgba(255, 255, 255, 0.15); 
      border-color: rgba(255, 255, 255, 0.3); 
      transform: translateY(-1px); 
    }
    .btn-glass:active { transform: scale(0.95); }
    
    .action-btn {
      width: 32px; height: 32px; border-radius: 8px; font-size: 0.9rem;
    }

    .tag { display: inline-block; background: rgba(99,102,241,0.15); border: 1px solid rgba(129,140,248,0.3); border-radius: 6px; padding: 2px 8px; font-size: 0.65rem; color: #c7d2fe; letter-spacing: 0.5px; }
    
    .modal-overlay { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.8); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 1rem; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    
    .modal-content { transform: scale(0.95) translateY(20px); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); opacity: 0; }
    .modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }

    .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* Table Styles */
    table { border-collapse: separate; border-spacing: 0; }
    th { background: rgba(255, 255, 255, 0.02); font-weight: 600; }
    tr { transition: background 0.2s; }
    td, th { border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    tr:last-child td { border-bottom: none; }
  </style>
</head>

  <script type="module">
    const { signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, collection, getDocs, doc, updateDoc, deleteDoc, query, orderBy, serverTimestamp, onSnapshot, writeBatch } = window.Fb;

    // ========== LOGIN UI ==========
    function LoginUI() {

                <svg class="w-6 h-6" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                অ্যাডমিন সাইন-ইন
              </button>
              <p id="auth-error" class="text-red-400 text-sm mt-4 hidden bg-red-500/10 py-2 rounded-lg border border-red-500/20"></p>
            </div>
            
            <p class="relative z-10 text-[11px] text-slate-500 uppercase tracking-widest mt-6">শুধুমাত্র অনুমোদিত ব্যক্তির জন্য</p>
          </div>
        </div>`;
    }

    function attachLoginListeners() {
      $('#btn-admin-login')?.addEventListener('click', async () => {
        try {
          await signInWithPopup(auth, googleProvider);
        } catch (e) {
          if (e.code !== 'auth/popup-closed-by-user') {
            const errEl = $('#auth-error');
            errEl.textContent = 'সাইন-ইন ব্যর্থ হয়েছে। আবার চেষ্টা করুন।';
            errEl.classList.remove('hidden');
          }
        }
      });
    }

    // ========== DASHBOARD UI ==========
    function DashboardUI() {
      return `
        <div class="flex flex-col min-h-screen pb-10 max-w-6xl mx-auto w-full animate-slide-up">
          
          <header class="glass mx-4 mt-6 px-6 py-4 flex items-center justify-between rounded-2xl sticky top-4 z-40">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-full bg-indigo-500/20 flex items-center justify-center border border-indigo-500/30">
                <span class="text-xl">☁️</span>
              </div>
              <div>
                <h1 class="text-xl font-bold bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent leading-tight">JRS Cloud</h1>
                <p class="text-[10px] text-indigo-300 uppercase tracking-wider">অ্যাডমিন প্যানেল</p>
              </div>
            </div>
            <button id="btn-logout" class="btn-glass text-sm py-2 px-5 rounded-xl border-red-500/30 hover:bg-red-500/20 hover:border-red-500/50 text-red-200">
              লগআউট
            </button>
          </header>

          <div class="px-4 mt-6 grid grid-cols-2 md:grid-cols-3 gap-4">
            <div class="glass-card p-6 rounded-2xl flex flex-col items-center justify-center relative overflow-hidden group">
              <div class="absolute -right-4 -top-4 w-16 h-16 bg-blue-500/10 rounded-full blur-xl group-hover:bg-blue-500/20 transition-all"></div>
              <span class="text-3xl mb-2">👥</span>
              <p class="text-3xl font-bold text-white tracking-tight" id="stat-users">0</p>
              <p class="text-xs text-slate-400 font-medium mt-1 uppercase tracking-wider">মোট ইউজার</p>
            </div>
            
            <div class="glass-card p-6 rounded-2xl flex flex-col items-center justify-center relative overflow-hidden group">
              <div class="absolute -right-4 -top-4 w-16 h-16 bg-emerald-500/10 rounded-full blur-xl group-hover:bg-emerald-500/20 transition-all"></div>
              <span class="text-3xl mb-2">📱</span>
              <p class="text-3xl font-bold text-white tracking-tight" id="stat-contacts">0</p>
              <p class="text-xs text-slate-400 font-medium mt-1 uppercase tracking-wider">মোট কন্টাক্ট</p>
            </div>
            
            <div class="glass-card p-6 rounded-2xl flex flex-col items-center justify-center col-span-2 md:col-span-1 relative overflow-hidden group">
              <div class="absolute -right-4 -top-4 w-16 h-16 bg-purple-500/10 rounded-full blur-xl group-hover:bg-purple-500/20 transition-all"></div>
              <span class="text-3xl mb-2">⚡</span>
              <p class="text-3xl font-bold text-white tracking-tight" id="stat-active">0</p>
              <p class="text-xs text-slate-400 font-medium mt-1 uppercase tracking-wider">সক্রিয় ইউজার</p>
            </div>
          </div>

          <div class="px-4 mt-6 flex-1 flex flex-col">
            <div class="glass rounded-2xl overflow-hidden flex-1 flex flex-col">
              <div class="p-5 border-b border-white/5 flex items-center justify-between bg-white/[0.02]">
                <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                  <span class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span>
                  ইউজার ডেটাবেস
                </h2>
              </div>
              
              <div class="overflow-x-auto">
                <table class="w-full text-left text-sm whitespace-nowrap">
                  <thead class="bg-white/[0.03] text-slate-400 text-[11px] uppercase tracking-widest">
                    <tr>
                      <th class="p-4 pl-6">ইমেইল</th>
                      <th class="p-4 hidden sm:table-cell">ইউজার আইডি (UID)</th>
                      <th class="p-4 text-center">স্ট্যাটাস</th>
                      <th class="p-4 text-center">কন্টাক্ট সংখ্যা</th>
                      <th class="p-4 text-center pr-6">অ্যাকশন</th>
                    </tr>
                  </thead>
                  <tbody id="user-table-body" class="divide-y divide-white/5">
                    </tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="text-center mt-8 text-xs text-slate-500 font-medium">
            Developed by <a href="https://jakariya41jr.xyz" target="_blank" class="text-indigo-400 hover:text-indigo-300 hover:underline transition-colors">Md Jakariya Hasan</a>
          </div>
        </div>

        <div id="contacts-modal" class="modal-overlay">
          <div class="glass modal-content w-full max-w-2xl mx-4 rounded-[2rem] overflow-hidden flex flex-col max-h-[85vh]">
            <div class="p-6 border-b border-white/10 flex justify-between items-center bg-white/[0.02]">
              <div>
                <h2 class="text-xl font-bold text-white" id="contacts-modal-title">কন্টাক্ট লিস্ট</h2>
                <p class="text-xs text-slate-400 mt-1">ইউজারের সেভ করা সকল নম্বর</p>
              </div>
              <button id="btn-close-contacts-modal" class="w-10 h-10 rounded-full btn-glass bg-white/5 hover:bg-white/10 flex items-center justify-center text-slate-300 hover:text-white transition-colors">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13 1L1 13M1 1L13 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
            
            <div class="p-6 overflow-y-auto space-y-3 custom-scrollbar" id="contacts-modal-content">
              </div>
          </div>
        </div>

        <div id="impersonation-banner" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-purple-600/90 backdrop-blur-md text-white px-6 py-3 rounded-full shadow-[0_10px_30px_rgba(147,51,234,0.3)] border border-purple-400/30 text-sm font-semibold z-50 flex items-center gap-3 animate-slide-up">
          <span class="animate-pulse">⚡</span> 
          <span>আপনি এখন <span id="impersonation-email" class="text-purple-200"></span> হিসেবে লগইন আছেন</span>
          <div class="w-px h-4 bg-white/20 mx-1"></div>
          <button id="btn-exit-impersonation" class="text-purple-200 hover:text-white underline decoration-purple-400/50 hover:decoration-white transition-colors">বেরিয়ে আসুন</button>
        </div>

    }

    function attachDashboardListeners() {
      $('#btn-logout')?.addEventListener('click', () => signOut(auth));
      
      const closeModal = () => {
        $('#contacts-modal').classList.remove('active');
        setTimeout(() => {
          $('#contacts-modal-content').innerHTML = '';
        }, 300);
      };

      $('#btn-close-contacts-modal')?.addEventListener('click', closeModal);
      $('#contacts-modal')?.addEventListener('click', (e) => {
        if (e.target === $('#contacts-modal')) closeModal();
      });
    }

    // ========== DATA LOADING & RENDERING ==========
    async function loadDashboardData() {
      const tbody = $('#user-table-body');
      tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-400"><div class="inline-block w-6 h-6 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin mb-2"></div><br>ডেটা লোড হচ্ছে...</td></tr>`;

      try {
        const usersSnap = await getDocs(collection(db, 'users'));
        const users = [];
        let totalContacts = 0;
        let activeUsers = 0;

        for (const userDoc of usersSnap.docs) {
          const userData = userDoc.data();
          const contactsSnap = await getDocs(collection(db, 'users', userDoc.id, 'contacts'));
          const contactCount = contactsSnap.size;
          totalContacts += contactCount;
          if (!userData.banned) activeUsers++;

          users.push({
            id: userDoc.id,
            email: userData.email || 'N/A',
            banned: userData.banned || false,
            contactCount
          });
        }

        AppState.allUsers = users;

        // Update stats
        $('#stat-users').textContent = users.length;
        $('#stat-contacts').textContent = totalContacts;
        $('#stat-active').textContent = activeUsers;

        if(users.length === 0) {
           tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-400">কোনো ইউজার পাওয়া যায়নি</td></tr>`;
           return;
        }

        // Render table
        tbody.innerHTML = users.map(u => `
          <tr class="hover:bg-white/[0.03] transition-colors group">
            <td class="p-4 pl-6 text-sm font-medium text-slate-200">${escapeHtml(u.email)}</td>
            <td class="p-4 text-xs font-mono text-slate-500 hidden sm:table-cell group-hover:text-slate-300 transition-colors">${u.id}</td>
            <td class="p-4 text-center">
              <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-semibold tracking-wide border ${
                u.banned 
                ? 'bg-red-500/10 text-red-400 border-red-500/20' 
                : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20'
              }">
                <span class="w-1.5 h-1.5 rounded-full ${u.banned ? 'bg-red-400' : 'bg-emerald-400'}"></span>
                ${u.banned ? 'ব্যানড' : 'সক্রিয়'}
              </span>
            </td>
            <td class="p-4 text-center">
              <span class="bg-white/5 border border-white/10 px-3 py-1 rounded-lg text-sm font-bold text-slate-300">${u.contactCount}</span>
            </td>
            <td class="p-4 pr-6 text-center">
              <div class="flex items-center justify-center gap-2">
                <button data-uid="${u.id}" data-email="${escapeHtml(u.email)}" class="btn-view-contacts btn-glass action-btn bg-blue-500/10 border-blue-500/20 text-blue-300 hover:bg-blue-500/20 hover:text-blue-200" title="কন্টাক্ট দেখুন">👁️</button>
                <button data-uid="${u.id}" data-email="${escapeHtml(u.email)}" class="btn-impersonate btn-glass action-btn bg-purple-500/10 border-purple-500/20 text-purple-300 hover:bg-purple-500/20 hover:text-purple-200" title="ইউজারের অ্যাকাউন্টে লগইন করুন">👻</button>
                <button data-uid="${u.id}" class="btn-toggle-ban btn-glass action-btn ${u.banned ? 'bg-emerald-500/10 border-emerald-500/20 text-emerald-300 hover:bg-emerald-500/20' : 'bg-orange-500/10 border-orange-500/20 text-orange-300 hover:bg-orange-500/20'}" title="${u.banned ? 'আনব্যান করুন' : 'ব্যান করুন'}">
                  ${u.banned ? '✅' : '⛔'}
                </button>
                <button data-uid="${u.id}" class="btn-delete-user btn-glass action-btn bg-red-500/10 border-red-500/20 text-red-300 hover:bg-red-500/30 hover:text-red-200" title="ইউজার ডিলিট করুন">🗑️</button>
              </div>
            </td>
          </tr>
        `).join('');

        // Attach row actions
        tbody.querySelectorAll('.btn-view-contacts').forEach(btn => {
          btn.onclick = () => viewUserContacts(btn.dataset.uid, btn.dataset.email);
        });
        tbody.querySelectorAll('.btn-impersonate').forEach(btn => {
          btn.onclick = () => impersonateUser(btn.dataset.uid, btn.dataset.email);
        });
        tbody.querySelectorAll('.btn-toggle-ban').forEach(btn => {
          btn.onclick = () => toggleBanUser(btn.dataset.uid);
        });
        tbody.querySelectorAll('.btn-delete-user').forEach(btn => {
          btn.onclick = () => deleteUser(btn.dataset.uid);
        });

      } catch (error) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-red-400">ডেটা লোড করতে সমস্যা হয়েছে।</td></tr>`;
      }
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[m]);
    }

    // ========== ACTIONS ==========
    async function viewUserContacts(uid, email) {
      $('#contacts-modal-title').textContent = email;
      const content = $('#contacts-modal-content');
      content.innerHTML = `
        <div class="flex justify-center items-center py-12">
          <div class="w-6 h-6 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
        </div>`;
      
      $('#contacts-modal').classList.add('active');

      try {
        const contactsSnap = await getDocs(collection(db, 'users', uid, 'contacts'));
        if (contactsSnap.empty) {
          content.innerHTML = `
            <div class="text-center py-12 bg-white/5 rounded-2xl border border-white/5">
              <span class="text-4xl mb-3 block">📭</span>
              <p class="text-slate-400 font-medium">এই ইউজারের কোনো কন্টাক্ট নেই</p>
            </div>`;
          return;
        }
        
        content.innerHTML = contactsSnap.docs.map(doc => {
          const d = doc.data();
          const tags = (d.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
          return `
            <div class="glass-card p-4 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-l-4 border-l-indigo-500/50">
              <div class="flex-1">
                <h3 class="font-bold text-white text-lg flex items-center gap-2">
                  ${escapeHtml(d.name)}
                </h3>
                <div class="flex flex-wrap items-center gap-3 mt-1.5">
                  <p class="text-sm text-indigo-200 font-mono bg-indigo-500/10 px-2 py-0.5 rounded flex items-center gap-1.5">
                    📞 ${escapeHtml(d.phone)}
                  </p>
                  ${d.profession ? `<p class="text-xs text-slate-400 flex items-center gap-1">💼 ${escapeHtml(d.profession)}</p>` : ''}
                </div>
                <p class="text-[11px] text-slate-500 mt-2 font-medium uppercase tracking-wide">
                  ${d.category||'Uncategorized'} ${d.section ? ` <span class="mx-1 text-slate-600">•</span> ${d.section}` : ''}
                </p>
              </div>
              <div class="flex flex-wrap gap-1.5 justify-end">
                ${tags}
              </div>
            </div>`;
        }).join('');
      } catch (error) {
         content.innerHTML = `<p class="text-center text-red-400 py-10">কন্টাক্ট লোড করতে ব্যর্থ হয়েছে</p>`;
      }
    }

    function impersonateUser(uid, email) {
      sessionStorage.setItem('impersonate_uid', uid);
      sessionStorage.setItem('impersonate_email', email);
      window.location.href = 'index.html?impersonate=true';
    }

    async function toggleBanUser(uid) {
      const user = AppState.allUsers.find(u => u.id === uid);
      if (!user) return;
      const newBanned = !user.banned;
      if (!confirm(`আপনি কি নিশ্চিত যে আপনি "${user.email}"-কে ${newBanned ? 'ব্যান' : 'আনব্যান'} করতে চান?`)) return;

      try {
        await updateDoc(doc(db, 'users', uid), {
          banned: newBanned,
          updatedAt: serverTimestamp()
        });
        loadDashboardData();
      } catch (error) {
        alert("স্ট্যাটাস আপডেট করতে সমস্যা হয়েছে।");
      }
    }

    async function deleteUser(uid) {
      const user = AppState.allUsers.find(u => u.id === uid);
      if (!user) return;
      if (!confirm(`⚠️ সতর্কবার্তা! \nআপনি কি নিশ্চিত যে সম্পূর্ণ ডেটাসহ "${user.email}" ডিলিট করতে চান? \n\nএই অ্যাকশনটি আর পরিবর্তন করা যাবে না!`)) return;

      try {
        const contactsSnap = await getDocs(collection(db, 'users', uid, 'contacts'));
        const batch = writeBatch(db);
        contactsSnap.docs.forEach(docSnap => batch.delete(docSnap.ref));
        batch.delete(doc(db, 'users', uid));
        await batch.commit();
        loadDashboardData();
      } catch (error) {
         alert("ইউজার ডিলিট করতে ব্যর্থ হয়েছে।");
      }
    }

    // ========== AUTH STATE ==========
    onAuthStateChanged(auth, (user) => {
      if (user && user.uid === ADMIN_UID) {
        AppState.user = user;
        renderApp();
      } else if (user) {
        alert('অ্যাক্সেস ডিনাইড! শুধুমাত্র অ্যাডমিন এখানে প্রবেশ করতে পারবেন।');
        signOut(auth);
      } else {
        AppState.user = null;
        renderApp();
      }
    });

    renderApp();
  </script>
</body>
</html>
